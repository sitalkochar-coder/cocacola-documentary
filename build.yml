name: Build Hindi Coca-Cola Pilot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build video
        run: python build.py
      - name: Upload finished video and subtitles
        uses: actions/upload-artifact@v4
        with:
          name: cocacola-hindi-pilot
          path: output/
          if-no-files-found: error
          retention-days: 7
